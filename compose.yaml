name: calavera

services:
  # wrapper-lite: holds the Apple Music session and serves the decryption API.
  # Reachable on the Compose network only.
  wrapper:
    # The pinned wrapper-lite commit is set in wrapper/Dockerfile.
    build: ./wrapper
    image: calavera-wrapper:local
    init: true
    restart: unless-stopped
    # Runs as user 10001 (set in the image), with no capabilities and no way to
    # gain any. wrapper-lite's rootless launcher creates its own user, mount
    # and PID namespaces, bind-mounts /dev/urandom and mounts /proc inside
    # them; Docker's defaults block each step, so three of them are relaxed.
    # Tested by removing one at a time:
    #   seccomp:unconfined      without it: "unshare: Operation not permitted"
    #   apparmor:unconfined     without it: "mount /dev/urandom failed: Permission denied"
    #   systempaths=unconfined  without it: "mount proc failed: Operation not permitted"
    # As a non-root user these do not reach the host: /proc/sys, sysrq-trigger
    # and the like stay read-only for it, also from inside its namespaces.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
      - apparmor:unconfined
      - systempaths=unconfined
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - wrapper-session:/app/rootfs/data
      - control:/control
    expose:
      - "12340"
      - "12341"

  # Calavera: web UI, API, download queue, FLAC conversion, library import.
  app:
    # The pinned amdl release is set in app/Dockerfile.
    build: ./app
    image: calavera-app:local
    init: true
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - wrapper
    environment:
      TZ: ${TZ:-UTC}
      CALAVERA_WRAPPER_URL: http://wrapper:12340
      CALAVERA_SUPERVISOR_URL: http://wrapper:12341
      CALAVERA_CONTROL_TOKEN_FILE: /control/token
    ports:
      - "${BIND_ADDRESS:?set BIND_ADDRESS in .env}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - "${STAGING_PATH:-./data/staging}:/staging"
      - control:/control:ro
      # The music library. rslave: a network mount that comes up after this
      # container is still seen. create_host_path: false: Docker never creates
      # the folder itself if the path is wrong.
      - type: bind
        source: ${LIBRARY_PATH:?set LIBRARY_PATH in .env}
        target: /library
        bind:
          propagation: rslave
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wrapper-session:
  control:

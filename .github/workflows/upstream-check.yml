# Weekly: tell me when amdl or wrapper-lite has something newer than the
# versions pinned in compose.yaml, by opening an issue. Nothing is updated
# automatically.
name: Upstream check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare pinned versions with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-upstream.sh

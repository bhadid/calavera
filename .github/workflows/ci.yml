# On every push to main and every pull request: run the backend tests, build
# the app image (which type-checks and builds the frontend) and check the
# accent colours. The same commands as in docs/DEVELOPMENT.md.
#
# The wrapper image is not built here: it compiles wrapper-lite from source,
# which downloads about 1 GB and takes several minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Backend tests
        run: docker build --target test app
      - name: App image, with frontend type check and build
        run: docker build app
      - name: Accent colour check
        run: docker run --rm -v "$PWD":/w -w /w node:22-alpine node scripts/check-accent.mjs
